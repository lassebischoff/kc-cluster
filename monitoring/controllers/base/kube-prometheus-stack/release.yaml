apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack # The chart to the repostory defined below
      version: "66.2.2"

      # version: "58.x" # Can also be pinned to a major version by appending an x. Minor version will be updated automatically

      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack # The link to the repository
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      adminPassword: lasse
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.lassebischoff.org
        path: /
        tls:
          - secretName: grafana-general-tls
            hosts:
              - grafana.lassebischoff.org
